services:
  registry:
    build:
      context: ./registry
    environment:
      # Correct mode: metadata points npm tarballs back through NGINX.
      # Wrong-mode experiment: change this to http://localhost:4873
      TARBALL_BASE_URL: ${TARBALL_BASE_URL:-http://localhost:8080}
      # Empty disables auth. Set REGISTRY_AUTH_TOKEN to emulate an upstream
      # Artifactory repository that requires an npm bearer token.
      AUTH_TOKEN: ${REGISTRY_AUTH_TOKEN:-}
      PORT: 4873
    ports:
      - "${REGISTRY_PORT:-4873}:4873"
    volumes:
      - ./registry/packages:/app/packages

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - registry
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx

volumes:
  nginx-cache:
