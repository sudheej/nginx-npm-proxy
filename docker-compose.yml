services:
  registry:
    build:
      context: ./registry
    environment:
      # Correct mode: metadata points npm tarballs back through NGINX.
      # Wrong-mode experiment: change this to http://localhost:4873
      TARBALL_BASE_URL: ${TARBALL_BASE_URL:-http://localhost:8080}
      PORT: 4873
    ports:
      - "4873:4873"
    volumes:
      - ./registry/packages:/app/packages

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - registry
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx

volumes:
  nginx-cache:
