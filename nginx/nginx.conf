worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format cache_lab '$remote_addr - $request '
                         'status=$status upstream=$upstream_addr '
                         'cache=$upstream_cache_status '
                         'uri="$uri" args="$args"';

    access_log /var/log/nginx/access.log cache_lab;
    error_log  /var/log/nginx/error.log warn;

    # Tarball cache only. Metadata is intentionally not cached in this lab.
    proxy_cache_path /var/cache/nginx/npm-tgz
                     levels=1:2
                     keys_zone=npm_tgz_cache:10m
                     max_size=200m
                     inactive=30d
                     use_temp_path=off;

    upstream npm_registry {
        server registry:4873;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # proxy_pass forwards Authorization by default. Keep this explicit
        # because authenticated upstream registries depend on this contract.
        proxy_set_header Authorization $http_authorization;

        # Cache immutable npm package tarballs. This regex preserves the full
        # original URI, including encoded scoped package paths.
        location ~ \.tgz$ {
            proxy_pass http://npm_registry;

            proxy_cache npm_tgz_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Authenticated npm requests can be user-specific; do not cache them.
            proxy_no_cache $http_authorization;
            proxy_cache_bypass $http_authorization;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Metadata, search, audit, dist-tags, and everything else proxy upstream
        # without cache. This keeps metadata freshness visible during experiments.
        location / {
            proxy_pass http://npm_registry;
            add_header X-Cache-Status BYPASS always;
        }
    }
}
